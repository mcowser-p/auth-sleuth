---
driver:
  name: docker
platforms:
  - name: auth-alma9
    image: almalinux:9
    pre_build_image: true
  - name: auth-ubuntu
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true

role_name_check: 1
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../../../roles
